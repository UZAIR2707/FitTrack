<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FitTrack - Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-dark">

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-md-5">

                <div class="card p-4">

                    <h2 class="text-center mb-4">
                        Create Your Account
                    </h2>

                    <form method="post">

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   class="form-control"
                                   placeholder="Enter your name"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email Address
                            </label>

                            <input type="email"
                                   class="form-control"
                                   placeholder="Enter your email"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Enter your password"
                                   required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input type="password"
                                   class="form-control"
                                   placeholder="Confirm your password"
                                   required>

                        </div>

                        <div class="d-grid">

                            <button type="submit"
                                    class="btn btn-success">
                                Create Account
                            </button>

                        </div>

                    </form>


                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                    <div class="text-center">

                        <a href="index.html">
                            Back to Home
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
